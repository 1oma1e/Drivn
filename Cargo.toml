[workspace]
members = ["crates/core", "crates/windows", "crates/scan-cli", "crates/installer", "app/src-tauri"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "UNLICENSED"
publish = false
version = "1.0.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

# Small binaries: Drivn should take little disk space (ADR-0014).
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
