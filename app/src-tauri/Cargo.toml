[package]
name = "drivn-app"
description = "Drivn desktop app (Tauri 2): serves app/ui and runs the read-only scan and the decision engine."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "drivn"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
drivn-core = { path = "../../crates/core" }
drivn-windows = { path = "../../crates/windows" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"

[features]
# Built without the Tauri CLI: this feature makes the binary serve the embedded app/ui files.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[lints]
workspace = true
